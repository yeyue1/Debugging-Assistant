name: Build and Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-2022

    steps:
    - uses: actions/checkout@v3

    - name: Setup MSVC
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    - name: Setup Qt
      uses: jurplel/install-qt-action@v3
      with:
        version: '6.6.0'
        host: 'windows'
        target: 'desktop'
        arch: 'win64_msvc2019_64'
        modules: 'qtserialport'

    - name: Configure
      shell: pwsh
      run: |
        cmake -S . -B ci-build -G Ninja `
          -DCMAKE_BUILD_TYPE=Release `
          -DCMAKE_PREFIX_PATH="$env:Qt6_DIR"

    - name: Build
      shell: pwsh
      run: |
        cmake --build ci-build --config Release

    - name: Run Tests
      shell: pwsh
      run: |
        $qtPrefix = Split-Path -Parent (Split-Path -Parent (Split-Path -Parent $env:Qt6_DIR))
        $qtBin = Join-Path $qtPrefix 'bin'
        $env:PATH = "$qtBin;$env:PATH"
        where.exe Qt6Core.dll
        ctest --test-dir ci-build --output-on-failure -V
